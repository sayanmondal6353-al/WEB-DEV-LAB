<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P10 Portfolio Header and Footer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1f2937;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      background-color: #2c8cb5;
      color: white;
      padding: 20px 40px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header-text p {
      margin: 5px 0 0;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    nav a:hover {
      color: #c7f0f7;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 15px;
    }

    section {
      background-color: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    h2 {
      margin-top: 0;
      color: #225177;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill {
      background-color: #e6f4f3;
      color: #1c5787;
      padding: 8px 12px;
      border-radius: 6px;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background-color: #007289;
      color: white;
      padding: 18px 40px;
    }

    footer p {
      margin: 0;
    }

    footer a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-text">
      <h1>Sayan Mondal</h1>
      <p>B.Tech CSE AI and ML Student</p>
    </div>

    <nav>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About Me</h2>
      <p>
        I am a student interested in web development, programming, and Artificial Intelligence.
      </p>
    </section>

    <section id="skills">
      <h2>Skills</h2>

      <div class="skills">
        <div class="skill">HTML</div>
        <div class="skill">CSS</div>
        <div class="skill">Java</div>
        <div class="skill">Python</div>
        <div class="skill">GitHub</div>
      </div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Email: sayan@example.com</p>
    </section>
  </main>

  <footer>
    <p> &copy; 2026 Sayan Mondal</p>
    <a href="#about">Back to Top</a>
  </footer>
</body>
</html>
